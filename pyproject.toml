[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsync2mp3"
version = "1.2.0"
description = "Mirror a lossless music library into MP3, Opus or AAC, incrementally, rsync-style"
readme = "README.md"
# 3.11 for tomllib, which the config loader imports unconditionally.
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mutagen>=1.45"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]

[project.scripts]
rsync2mp3 = "rsync2mp3:main"
rsync2opus = "rsync2opus:main"
rsync2aac = "rsync2aac:main"

[tool.setuptools]
py-modules = ["rsync2mp3", "rsync2opus", "rsync2aac"]
